- name: Install ghostty via PPA
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    bash -c "$(curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh)"
  args:
    creates: /usr/bin/ghostty
    executable: /bin/bash
  register: result
  ignore_errors: true
  changed_when: result.rc == 0

- name: Ensure having xdg-terminals directory
  become: true
  ansible.builtin.file:
    path: /usr/share/xdg-terminals
    state: directory
    mode: "0755"

- name: Ensure having xdg-terminals symlink
  become: true
  ansible.builtin.file:
    src: /usr/share/applications/com.mitchellh.ghostty.desktop
    dest: /usr/share/xdg-terminals/com.mitchellh.ghostty.desktop
    state: link

- name: Ensure having xdg-terminals.list
  ansible.builtin.copy:
    content: "com.mitchellh.ghostty.desktop\n"
    dest: "{{ ansible_facts['user_dir'] }}/.config/xdg-terminals.list"
    mode: "0644"

- name: Install python3-nautilus
  become: true
  ansible.builtin.apt:
    name: python3-nautilus
    state: present

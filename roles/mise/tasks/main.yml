---
- name: Install mise
  ansible.builtin.shell: |
    set -o pipefail
    bash -c "$(curl -fsSL https://mise.run/zsh)"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/mise"
    executable: /bin/bash
  register: result
  ignore_errors: true
  changed_when: result.rc == 0

- name: Install tools
  ansible.builtin.shell: |
    set -o pipefail
    {{ ansible_facts['user_dir'] }}/.local/bin/mise install
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/mise/installs"
    executable: /bin/bash
  register: result
  ignore_errors: true
  changed_when: result.rc == 0

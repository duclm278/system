---
- name: Install docker
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    bash -c "$(curl -fsSL https://get.docker.com)"
  args:
    creates: /usr/bin/docker
    executable: /bin/bash
  register: result
  ignore_errors: true
  changed_when: result.rc == 0

- name: Ensure docker-group added user {{ ansible_facts['user_id'] }}
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true

- name: Disable docker on boot (but not on socket) to save battery
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: false
